name: Debian sync

on:
  pull_request:
    paths:
      - bin/sync.sh
      - bin/test_sync.py
      - .github/workflows/debian-sync.yml
      - 'skills/*/SKILL.md'
  push:
    branches: [main]
    paths:
      - bin/sync.sh
      - bin/test_sync.py
      - .github/workflows/debian-sync.yml
      - 'skills/*/SKILL.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debian-sync:
    name: Sync (Debian ${{ matrix.debian }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        debian: ['12', '13']
    container: debian:${{ matrix.debian }}-slim
    timeout-minutes: 10
    steps:
      - name: Install test dependencies
        run: apt-get update && apt-get install -y --no-install-recommends bash python3 git ca-certificates libstdc++6
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: toolkit-src # Exercise sync from a nested checkout, not a fixed home path.
      - name: Run sync tests in Debian
        run: python3 toolkit-src/bin/test_sync.py -v
