name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install check dependencies
        run: python -m pip install -r bin/requirements-check.txt
      - name: Run offline checks
        run: bin/check

  debian-sync:
    runs-on: ubuntu-latest
    container: debian:stable-slim
    timeout-minutes: 10
    steps:
      - name: Install test dependencies
        run: apt-get update && apt-get install -y --no-install-recommends bash python3 git ca-certificates libstdc++6
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: toolkit-src # Exercise sync from a nested checkout, not a fixed home path.
      - name: Run sync tests in Debian
        run: python3 toolkit-src/bin/test_sync.py -v
