name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privacy:
    name: Secret and privacy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          read -r version checksum < <(python3 -c 'import json; p = json.load(open("bin/gitleaks-pin.json")); print(p["version"], p["linux_x64_sha256"])')
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --retry 3 \
            -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          printf '%s  gitleaks.tar.gz\n' "$checksum" | sha256sum --check
          mkdir -p gitleaks-bin
          tar -xzf gitleaks.tar.gz -C gitleaks-bin gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: Test gate with real scanner
        run: python3 bin/test_private.py --real
      - name: Check reachable history
        run: bin/check-private history

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Install check dependencies
        run: python -m pip install -r bin/requirements-check.txt
      - name: Run offline checks
        run: bin/check

  debian-sync:
    runs-on: ubuntu-latest
    container: debian:stable-slim
    timeout-minutes: 10
    steps:
      - name: Install test dependencies
        run: apt-get update && apt-get install -y --no-install-recommends bash python3 git ca-certificates libstdc++6
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: toolkit-src # Exercise sync from a nested checkout, not a fixed home path.
      - name: Run sync tests in Debian
        run: python3 toolkit-src/bin/test_sync.py -v
